<!DOCTYPE html>
<html>

<head>
  <meta
    http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true"
  >
  <title>Page not found · cq-mev</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = '404';
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found · cq-mev">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#fafbf7">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
    }

    main.error .section {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    main.error .error-code {
      margin: 0;
      font-family: ui-monospace, sfmono-regular, consolas, monospace;
      font-size: var(--body-font-size-s);
      letter-spacing: 0.08em;
      color: var(--dark-color);
    }

    main.error .error-message {
      margin: 8px 0 16px;
    }
  </style>
  <link rel="stylesheet" href="/styles/lazy-styles.css">
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <p class="error-code">404 · not-found</p>
      <h1 class="error-message">This page isn't here.</h1>
      <p>Unknown is an answer, but not a helpful one. Start from the story or the guide.</p>
      <p class="button-container">
        <a href="/" class="button error-button-home">The story</a>
        <a href="/guide" class="button secondary">The guide</a>
      </p>
    </div>
  </main>
  <footer></footer>
</body>

</html>
